version: "3.8"

services:
  db:
    image: postgres:16-alpine
    environment:
      TZ: Europe/Prague
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d postgres" ]
      interval: 3s
      timeout: 3s
      retries: 10
    ports: ["${PG_HOST_PORT:-5432}:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "${AMQP_HOST_PORT:-5672}:5672"   # AMQP
      - "${AMQP_MGMT_PORT:-15672}:15672" # Web UI
    environment:
      TZ: Europe/Prague
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  spring-app:
    build: .
    ports: ["${SERVER_PORT:-9001}:9001"]
    environment:
      TZ: Europe/Prague
      SPRING_PROFILES_ACTIVE: dev

      # PostgreSQL config
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/postgres
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres

      # RabbitMQ config
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: admin
      SPRING_RABBITMQ_PASSWORD: admin

      # Optional override for server port if not hardcoded
      SERVER_PORT: 9001

      JWT_SECRET: ${JWT_SECRET:?set-in-.env}
      SERIES_END: "2025-12-31:23:59"

    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres-data:
